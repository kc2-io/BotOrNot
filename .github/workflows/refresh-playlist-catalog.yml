name: Refresh playlist catalog

on:
  pull_request:
    paths:
      - 'scripts/generate_playlist_mappings.py'
      - 'scripts/test_playlist_generator.py'
      - 'scripts/playlist-overrides.json'
      - 'BotOrNot.Core/Data/PlaylistMappings.json'
      - '.github/workflows/refresh-playlist-catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: playlist-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test generator and catalog validation
        run: |
          python scripts/test_playlist_generator.py
          python -c "import json,sys; sys.path.insert(0, 'scripts'); import generate_playlist_mappings as g; g.canonical_catalog(json.load(open('BotOrNot.Core/Data/PlaylistMappings.json'))); g.load_overrides_from_value(json.load(open('scripts/playlist-overrides.json')))"

  refresh:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: playlist-catalog-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and validate generated artifacts
        run: |
          python scripts/generate_playlist_mappings.py --download --include-new --write --observation-date "$(date -u +%F)"
          python -m json.tool BotOrNot.Core/Data/PlaylistMappings.json > /dev/null
          python -m json.tool docs/playlist-catalog-report.json > /dev/null
          git diff --check
      - name: Open or update catalog pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/playlist-catalog
          delete-branch: true
          title: 'chore: refresh playlist catalog'
          commit-message: 'chore: refresh playlist catalog'
          body: |
            Automated playlist catalog refresh. Review docs/playlist-catalog-report.json,
            retained historical IDs, and source conflicts before merging.
          labels: data
