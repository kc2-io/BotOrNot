name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    environment: artifact-signing
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
              'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_SIGNING_PROFILE', 'AZURE_SIGNING_PUBLISHER')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing artifact-signing environment variable: $name"
            }
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build patched FortniteReplayReader
        shell: pwsh
        run: |
          $VER = "3.0.12-botornot"
          $FRD = Join-Path $env:RUNNER_TEMP "FRD"
          $OUT = Join-Path "${{ github.workspace }}" "local-packages"
          New-Item -ItemType Directory -Force -Path $OUT | Out-Null

          # Clone at the exact commit patches were written against
          git clone https://github.com/Shiqan/FortniteReplayDecompressor.git $FRD
          Push-Location $FRD
          git checkout 2fc699e

          # Apply the reviewed BotOrNot parser patch to the pinned upstream revision
          python "${{ github.workspace }}\patches\apply-patches.py" $FRD

          # Register the output dir as a NuGet source so subsequent packs can restore patched deps
          $nugetCfg = @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="local" value="$OUT" />
            </packageSources>
          </configuration>
          "@
          $nugetCfg.TrimStart() | Set-Content NuGet.config

          # 1. OozSharp — no project dependencies
          dotnet pack src/OozSharp/OozSharp.csproj -c Release -o $OUT -p:PackageVersion=$VER

          # 2. Unreal.Encryption — swap OozSharp ProjectReference to PackageReference
          $enc = "src\Unreal.Encryption\Unreal.Encryption.csproj"
          $text = Get-Content $enc -Raw
          $text = $text -replace [regex]::Escape('<ProjectReference Include="..\OozSharp\OozSharp.csproj" />'), "<PackageReference Include=`"OozSharp`" Version=`"$VER`" />"
          Set-Content $enc $text -NoNewline
          dotnet pack $enc -c Release -o $OUT -p:PackageVersion=$VER

          # 3. Unreal.Core — no project dependencies
          dotnet pack src/Unreal.Core/Unreal.Core.csproj -c Release -o $OUT -p:PackageVersion=$VER

          # 4. FortniteReplayReader — swap both ProjectReferences to PackageReferences
          $frr = "src\FortniteReplayReader\FortniteReplayReader.csproj"
          $text = Get-Content $frr -Raw
          $text = $text -replace [regex]::Escape('<ProjectReference Include="..\Unreal.Core\Unreal.Core.csproj" />'), "<PackageReference Include=`"Unreal.Core`" Version=`"$VER`" />"
          $text = $text -replace [regex]::Escape('<ProjectReference Include="..\Unreal.Encryption\Unreal.Encryption.csproj" />'), "<PackageReference Include=`"Unreal.Encryption`" Version=`"$VER`" />"
          Set-Content $frr $text -NoNewline
          dotnet pack $frr -c Release -o $OUT -p:PackageVersion=$VER

          Pop-Location
          Write-Host "Packed patched FortniteReplayReader $VER to $OUT"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Windows x64
        run: |
          dotnet publish BotOrNot.Avalonia/BotOrNot.Avalonia.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output ./publish/win-x64 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:DebugSymbols=false

      - name: Azure login for release signing
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign BotOrNot executable
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\publish\win-x64\BotOrNot.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify release signature
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: ./scripts/verify-release-signature.ps1 -FilePath ./publish/win-x64/BotOrNot.exe -ExpectedPublisher $env:EXPECTED_PUBLISHER

      - name: Create ZIP
        run: |
          Remove-Item ./publish/win-x64/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path ./publish/win-x64/* -DestinationPath ./BotOrNot-Windows-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./BotOrNot-Windows-x64.zip
          generate_release_notes: true
          append_body: true
          body: |
            ## About

            BotOrNot is a Windows app that analyzes your Fortnite replay files and gives you stats and information about players vs bots in your matches.

            ## How to Install

            1. Download **BotOrNot-Windows-x64.zip** from the Assets section below
            2. Extract the zip file to a folder of your choice
            3. Run **BotOrNot.exe**

            The included **BotOrNot.exe** is digitally signed. You can inspect its publisher in **Properties → Digital Signatures**. Windows SmartScreen may still show a reputation warning for a new release.

            ---
